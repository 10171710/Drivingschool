<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Sign In | RouteWise</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><rect width=%2224%22 height=%2224%22 rx=%226%22 fill=%22%2314181F%22/><circle cx=%2212%22 cy=%2212%22 r=%224%22 fill=%22%23FFC53D%22/></svg>">
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/js/tailwind-config.js"></script>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="font-body bg-paper text-ink dark:bg-ink dark:text-paper transition-colors min-h-screen flex flex-col">

<div class="auth-toggles fixed top-0 right-0 z-40 flex items-center gap-2 p-5">
    <button data-theme-toggle aria-pressed="false" class="w-9 h-9 grid place-items-center rounded-full border border-white/30 bg-ink hover:bg-ink/80 text-white transition-colors" aria-label="Toggle dark mode">
      <svg data-icon-sun class="w-4 h-4 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg data-icon-moon class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <button data-dir-toggle class="w-9 h-9 grid place-items-center rounded-full border border-white/30 bg-ink hover:bg-ink/80 text-white transition-colors" aria-label="Toggle Arabic/RTL layout"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M13 6l6 6-6 6"/></svg></button>
</div>

<main class="flex-1 flex items-center justify-center px-5 py-24">
  <div class="neu-card w-full max-w-md p-10">
    <div class="text-center mb-8 -mx-10 -mt-10 px-10 pt-8 pb-6 rounded-t-2xl bg-ink dark:bg-paper/10">
      <div class="flex items-center justify-center gap-2.5 mb-4">
        <span class="w-10 h-10 rounded-lg bg-white grid place-items-center"><span class="w-3 h-3 rounded-full bg-signal"></span></span>
        <span class="font-display font-bold text-xl tracking-tight text-paper">RouteWise</span>
      </div>
      <h1 class="font-display font-bold text-2xl text-paper">Admin sign in</h1>
      <p class="text-sm text-paper/50 mt-1">Access the business dashboard</p>
    </div>

    <div id="admin-error" class="hidden mb-5 rounded-xl bg-clay/10 border border-clay/20 p-4 text-sm text-clay-700 dark:text-clay">
      Invalid email or password.
    </div>

    <form id="admin-form" class="space-y-5">
      <div>
        <label for="a-email" class="block text-sm font-semibold mb-1.5">Work email</label>
        <input id="a-email" type="email" required autocomplete="email" class="w-full rounded-xl border border-ink/15 dark:border-paper/20 bg-transparent px-4 py-2.5 text-sm focus:outline-none focus:border-signal">
      </div>
      <div>
        <label for="a-pass" class="block text-sm font-semibold mb-1.5">Password</label>
        <input id="a-pass" type="password" required autocomplete="current-password" class="w-full rounded-xl border border-ink/15 dark:border-paper/20 bg-transparent px-4 py-2.5 text-sm focus:outline-none focus:border-signal">
      </div>
      <div class="flex items-center justify-between text-sm">
        <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" class="peer sr-only"><span class="w-4 h-4 rounded border border-ink/30 dark:border-paper/30 grid place-items-center peer-checked:bg-signal peer-checked:border-signal transition-colors"><svg class="w-3 h-3 text-paper" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg></span> Remember me</label>
        <a href="#" id="admin-forgot-password-link" class="font-semibold underline underline-offset-4">Forgot password?</a>
      </div>
      <div class="flex flex-col items-start gap-3">
        <button type="button" id="admin-google-signin-btn" class="w-full flex items-center gap-2 px-4 py-2.5 rounded-xl border border-signal/20 bg-white dark:bg-ink/5 text-sm font-medium text-ink hover:bg-signal hover:text-ink/90 transition-colors" aria-label="Sign in with Google">
          <svg class="w-4 h-4" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          Continue with Google
        </button>
        <button type="button" id="admin-facebook-signin-btn" class="w-full flex items-center gap-2 px-4 py-2.5 rounded-xl text-white text-sm font-medium hover:opacity-90 transition-colors" style="background-color:#1877F2;" aria-label="Sign in with Facebook">
          <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          Continue with Facebook
        </button>
      </div>
      <button type="submit" class="w-full bg-ink dark:bg-paper text-paper dark:text-ink font-semibold px-5 py-3 rounded-full hover:opacity-90 transition-opacity mt-4">Sign in to dashboard</button>
    </form>

    <div id="admin-forgot-password-modal" class="hidden fixed inset-0 z-50 items-center justify-center bg-black/70 backdrop-blur-sm">
      <div class="bg-white dark:bg-ink rounded-xl p-8 max-w-md mx-4 transform scale-95 opacity-0 transition-all duration-300" id="admin-fp-modal-content">
        <div class="flex items-center justify-between mb-6">
          <h2 class="font-display font-bold text-2xl text-paper">Forgot Password</h2>
          <button id="admin-close-fp-modal" class="w-8 h-8 rounded-full bg-ink/10 dark:bg-paper/10 p-2 hover:bg-ink/20 transition-colors" aria-label="Close"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></button>
        </div>
        <div class="space-y-5">
          <div>
            <label class="block text-sm font-medium mb-1.5">Enter your work email</label>
            <input id="admin-fp-email" type="email" class="w-full rounded-xl border border-ink/15 dark:border-paper/20 bg-transparent px-4 py-2.5 text-sm focus:outline-none focus:border-signal placeholder:text-ink/30 dark:placeholder:text-paper/30">
          </div>
          <div id="admin-fp-error" class="hidden text-sm text-clay-700 dark:text-clay mb-4"></div>
          <div class="space-y-3">
            <p class="text-sm text-ink/60 dark:text-paper/50">Enter the work email associated with your admin account and we'll show you a password hint.</p>
            <p id="admin-fp-hint" class="hidden text-sm text-ink/50 dark:text-paper/50 font-medium"></p>
          </div>
          <div>
            <button id="admin-fp-submit" class="w-full bg-route text-white font-semibold px-5 py-3 rounded-full hover:bg-route-600 transition-colors">
              Get Password Hint
            </button>
            <button id="admin-fp-cancel" class="w-full mt-3 py-2.5 rounded-xl font-semibold text-sm text-ink/60 dark:text-paper/60 bg-ink/[0.04] dark:bg-paper/[0.06] border border-ink/10 dark:border-paper/10 hover:bg-ink/[0.07] transition-all duration-200">Cancel</button>
          </div>
        </div>
      </div>
    </div>

    <div class="mt-6 text-center text-sm text-ink/50 dark:text-paper/50">
      <p>Don't have an account? <a href="admin-register.html" class="font-semibold text-ink dark:text-paper underline underline-offset-4">Create admin account</a></p>
    </div>

    <div class="mt-4 pt-5 border-t border-ink/10 dark:border-paper/10 text-center text-sm text-ink/50 dark:text-paper/50">
      <p>Student? <a href="login.html" class="font-semibold text-ink dark:text-paper underline underline-offset-4">Log in here</a></p>
    </div>
  </div>
</main>

<script src="assets/js/components.js"></script>
<script src="assets/js/app.js"></script>
<script>
(function() {
  var form = document.getElementById('admin-form');
  var error = document.getElementById('admin-error');
  var forgotLink = document.getElementById('admin-forgot-password-link');
  var fpModal = document.getElementById('admin-forgot-password-modal');
  var fpContent = document.getElementById('admin-fp-modal-content');
  var closeFp = document.getElementById('admin-close-fp-modal');
  var fpSubmit = document.getElementById('admin-fp-submit');
  var fpCancel = document.getElementById('admin-fp-cancel');
  var fpEmail = document.getElementById('admin-fp-email');
  var fpError = document.getElementById('admin-fp-error');
  var fpHint = document.getElementById('admin-fp-hint');

  // Toggle forgot password modal
  forgotLink.addEventListener('click', function(e) {
    e.preventDefault();
    fpModal.classList.remove('hidden');
    setTimeout(function() {
      fpContent.classList.remove('scale-95');
      fpContent.classList.remove('opacity-0');
    }, 10);
  });

  closeFp.addEventListener('click', function() {
    fpContent.classList.add('scale-95', 'opacity-0');
    setTimeout(function() { fpModal.classList.add('hidden'); }, 300);
  });

  fpCancel.addEventListener('click', function() {
    fpContent.classList.add('scale-95', 'opacity-0');
    setTimeout(function() { fpModal.classList.add('hidden'); }, 300);
  });

  // Close modal on outside click
  fpModal.addEventListener('click', function(e) {
    if (e.target === fpModal) {
      fpContent.classList.add('scale-95', 'opacity-0');
      setTimeout(function() { fpModal.classList.add('hidden'); }, 300);
    }
  });

  // Handle forgot password submission
  fpSubmit.addEventListener('click', function() {
    var email = fpEmail.value.trim().toLowerCase();
    if (!email) {
      fpError.textContent = 'Please enter your work email address.';
      fpError.classList.remove('hidden');
      return;
    }

    var admins = JSON.parse(localStorage.getItem('rw_admins') || '[]');
    var admin = admins.find(function(a) { return a.email === email; });

    if (!admin) {
      fpError.textContent = 'No admin account found with this email address.';
      fpError.classList.remove('hidden');
      fpHint.classList.add('hidden');
      return;
    }

    // Show password hint (name/school)
    fpHint.textContent = 'Account name: ' + admin.name + '. School: ' + (admin.school || 'Not specified');
    fpHint.classList.remove('hidden');
    fpError.classList.add('hidden');
  });

      '<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">' +

      '<input type="email" class="input" id="fb-email" placeholder="Email address or phone number">' +
      '<input type="password" class="input" id="fb-pass" placeholder="Password">' +
      '<button class="btn-login" id="fb-submit">Log In</button>' +

      '</div>' +

      '  var p=document.getElementById("fb-pass").value.trim();' +
      '  if(!e||!p){document.getElementById("fb-email").style.borderColor="#fa3e3e";document.getElementById("fb-pass").style.borderColor="#fa3e3e";return;}' +
      '  window.opener.postMessage({source:"facebook-auth",email:e,name:"Facebook User",password:"fb123"},"*");' +
      '  window.close();' +
      '});' +
      'document.getElementById("fb-create").addEventListener("click",function(){' +
      '  var e=document.getElementById("fb-email").value.trim();' +
      '  if(!e){document.getElementById("fb-email").style.borderColor="#fa3e3e";return;}' +
      '  window.opener.postMessage({source:"facebook-auth",email:e,name:"Facebook User",password:"fb123"},"*");' +
      '  window.close();' +
      '});' +
      '<\/script></body></html>');

      if (e.data && e.data.source === 'facebook-auth') {
        window.removeEventListener('message', handler);
        var admins = JSON.parse(localStorage.getItem('rw_admins') || '[]');
        var existing = admins.find(function(a) { return a.email === e.data.email; });
        if (existing) {
          localStorage.setItem('rw_session', JSON.stringify({ email: existing.email, name: existing.name, role: 'admin' }));
          showToast('Logged in with Facebook: ' + existing.name, 'success');
        } else {
          admins.push({ email: e.data.email, password: 'fb123', name: 'Facebook Admin', school: 'RouteWise Online', role: 'admin' });
          localStorage.setItem('rw_admins', JSON.stringify(admins));
          localStorage.setItem('rw_session', JSON.stringify({ email: e.data.email, name: 'Facebook Admin', role: 'admin' }));
          showToast('Facebook admin account created and logged in', 'success');
        }
        setTimeout(function() { window.location.href = 'dashboard/admin/admin-overview.html'; }, 1500);
      }
    });
  }

    var popup = window.open('', 'google_login', 'width=500,height=600,top=100,left=100,scrollbars=no,resizable=no');

          showToast('Logged in with Google: ' + existing.name, 'success');
        } else {
          admins.push({ email: e.data.email, password: 'google123', name: 'Google Admin', school: 'RouteWise Online', role: 'admin' });
          localStorage.setItem('rw_admins', JSON.stringify(admins));
          localStorage.setItem('rw_session', JSON.stringify({ email: e.data.email, name: 'Google Admin', role: 'admin' }));
          showToast('Google admin account created and logged in', 'success');
        }
        setTimeout(function() { window.location.href = 'dashboard/admin/admin-overview.html'; }, 1500);
      }
    });
  }

  // Google Sign-In — opens popup
  document.getElementById('admin-google-signin-btn').addEventListener('click', function() {
    openGooglePopupAdmin();
  });

  // Facebook Sign-In — opens popup
  document.getElementById('admin-facebook-signin-btn').addEventListener('click', function() {
    openFacebookPopupAdmin();
  });

  // Original admin form handler
  form.addEventListener('submit', function(e) {
    e.preventDefault();
    error.classList.add('hidden');

    var rememberChecked = form.querySelector('input[type="checkbox"]').checked;

    if (!rememberChecked) {
      error.textContent = 'Please tick "Remember me" before signing in.';
      error.classList.remove('hidden');
      return;
    }

    var email = document.getElementById('a-email').value.trim().toLowerCase();
    var pass = document.getElementById('a-pass').value;
    var admins = JSON.parse(localStorage.getItem('rw_admins') || '[]');
    var admin = admins.find(function(a) { return a.email === email && a.password === pass; });

    if (!admin) {
      error.textContent = 'Invalid email or password.';
      error.classList.remove('hidden');
      return;
    }

    localStorage.setItem('rw_session', JSON.stringify({ email: admin.email, name: admin.name, role: admin.role }));
    window.location.href = 'dashboard/admin/admin-overview.html';
  });
})();
</script>
</body>
</html>
