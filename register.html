<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account | RouteWise</title>
<meta name="description" content="Create a RouteWise student account to start tracking your driving lessons.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><rect width=%2224%22 height=%2224%22 rx=%226%22 fill=%22%2314181F%22/><circle cx=%2212%22 cy=%2212%22 r=%224%22 fill=%22%23FFC53D%22/></svg>">
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/js/tailwind-config.js"></script>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="font-body bg-paper text-ink dark:bg-ink dark:text-paper transition-colors min-h-screen flex flex-col">

<div class="auth-toggles fixed top-0 right-0 z-40 flex items-center gap-2 p-5">
    <button data-theme-toggle aria-pressed="false" class="w-9 h-9 grid place-items-center rounded-full border border-white/30 bg-ink hover:bg-ink/80 text-white transition-colors dark:bg-white/10 dark:border-white/40" aria-label="Toggle dark mode">
      <svg data-icon-sun class="w-4 h-4 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg data-icon-moon class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <button data-dir-toggle class="w-9 h-9 grid place-items-center rounded-full border border-white/30 bg-ink hover:bg-ink/80 text-white transition-colors dark:bg-white/10 dark:border-white/40" aria-label="Toggle Arabic/RTL layout"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M13 6l6 6-6 6"/></svg></button>
</div>

<main class="flex-1 flex items-center justify-center px-5 py-24">
  <div class="neu-card w-full max-w-md p-10">
    <div class="text-center mb-8 -mx-10 -mt-10 px-10 pt-8 pb-6 rounded-t-2xl bg-ink dark:bg-paper/10">
      <a href="index.html" class="flex items-center justify-center gap-2.5 mb-4 transition-transform hover:scale-[1.03]" aria-label="RouteWise home">
        <span class="w-10 h-10 rounded-lg bg-white grid place-items-center"><span class="w-3 h-3 rounded-full bg-signal"></span></span>
        <span class="font-display font-medium text-xl tracking-tight text-paper">RouteWise</span>
      </a>
      <h1 class="font-display font-semibold text-2xl text-paper">Create your account</h1>
      <p class="text-sm text-paper/50 mt-1">Start tracking your driving lessons today</p>
    </div>

    <div id="register-error" class="hidden mb-5 rounded-xl bg-clay/10 border border-clay/20 p-4 text-sm text-clay-700 dark:text-clay"></div>

    <form id="register-form" class="space-y-5">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label for="r-first" class="block text-sm font-semibold mb-1.5 dark:text-paper">First name</label>
          <input id="r-first" required class="w-full rounded-xl border border-ink/15 dark:border-paper/20 bg-transparent px-4 py-2.5 text-sm focus:outline-none focus:border-signal">
        </div>
        <div>
          <label for="r-last" class="block text-sm font-semibold mb-1.5 dark:text-paper">Last name</label>
          <input id="r-last" required class="w-full rounded-xl border border-ink/15 dark:border-paper/20 bg-transparent px-4 py-2.5 text-sm focus:outline-none focus:border-signal">
        </div>
      </div>
      <div>
        <label for="r-email" class="block text-sm font-semibold mb-1.5 dark:text-paper">Email</label>
        <input id="r-email" type="email" required autocomplete="email" class="w-full rounded-xl border border-ink/15 dark:border-paper/20 bg-transparent px-4 py-2.5 text-sm focus:outline-none focus:border-signal">
      </div>
      <div>
        <label for="r-pass" class="block text-sm font-semibold mb-1.5 dark:text-paper">Password</label>
        <input id="r-pass" type="password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters" class="w-full rounded-xl border border-ink/15 dark:border-paper/20 bg-transparent px-4 py-2.5 text-sm focus:outline-none focus:border-signal placeholder:text-ink/30 dark:placeholder:text-paper/30">
      </div>
      <label class="flex items-start gap-2 cursor-pointer text-sm text-ink/60 dark:text-paper/60"><input type="checkbox" required class="peer sr-only"><span class="w-4 h-4 mt-0.5 rounded border border-ink/30 dark:border-paper/30 grid place-items-center shrink-0 peer-checked:bg-signal peer-checked:border-signal transition-colors"><svg class="w-3 h-3 text-paper" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg></span> I agree to the Terms of Service and Privacy Policy.</label>
      <div class="flex flex-col items-start gap-3">
        <button type="button" id="apple-signin-btn" class="w-full flex items-center gap-2 px-4 py-2.5 rounded-xl border border-ink/10 dark:border-paper/20 bg-ink/[0.03] dark:bg-paper/[0.04] text-sm font-medium text-ink dark:text-paper hover:bg-ink/5 dark:hover:bg-paper/10 transition-colors" aria-label="Sign up with Apple">
          <svg class="w-4 h-4" viewBox="0 0 384 512" fill="currentColor"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.7-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
          Continue with Apple
        </button>
      </div>
      <button type="submit" class="w-full bg-signal text-ink font-semibold px-5 py-3 rounded-full hover:bg-signal-600 transition-colors">Create account</button>
    </form>

    <div class="mt-6 text-center text-sm text-ink/50 dark:text-paper/50">
      <p>Already have an account? <a href="login.html" class="font-semibold text-ink dark:text-paper underline underline-offset-4">Log in</a></p>
    </div>
  </div>
</main>

<script src="assets/js/components.js"></script>
<script src="assets/js/app.js"></script>
<script>
(function() {
  var form = document.getElementById('register-form');
  var error = document.getElementById('register-error');

  // Apple sign-in — opens popup and creates/logs in account
  document.getElementById('apple-signin-btn').addEventListener('click', function() {
    var popup = window.open('', 'apple_signup', 'width=500,height=600,top=100,left=100,scrollbars=no,resizable=no');
    if (!popup) { if (typeof showToast === 'function') showToast('Please allow popups for Apple sign-up', 'error'); return; }
    popup.document.write('<!DOCTYPE html><html><head><title>Sign in with Apple</title>' +
      '<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">' +
      '<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:DM Sans,sans-serif;background:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh}.a-box{width:400px;padding:48px 40px;text-align:center}.a-logo{width:60px;height:60px;background:#000;border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:#fff}.a-logo svg{width:26px;height:26px;fill:currentColor}.a-title{font-size:22px;font-weight:700;color:#161617;margin-bottom:6px}.a-sub{font-size:15px;color:#5f6368;margin-bottom:28px}.a-input{width:100%;padding:13px 15px;border:1px solid #d2d2d7;border-radius:12px;font-size:16px;color:#161617;outline:none;transition:border .2s;margin-bottom:20px}.a-input:focus{border-color:#0071e3;box-shadow:0 1px 6px rgba(0,113,227,.2)}.a-btn{width:100%;padding:12px;background:#161617;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;transition:background .2s}.a-btn:hover{background:#000}</style></head><body>' +
      '<div class="a-box">' +
      '<div class="a-logo"><svg viewBox="0 0 384 512"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.7-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg></div>' +
      '<div class="a-title">Sign up with Apple</div>' +
      '<div class="a-sub">Enter the email for your Apple ID</div>' +
      '<input type="email" class="a-input" id="a-email" placeholder="name@example.com">' +
      '<button class="a-btn" id="a-submit">Continue</button>' +
      '</div>' +
      '<script>' +
      'document.getElementById("a-submit").addEventListener("click",function(){' +
      '  var e=document.getElementById("a-email").value.trim();' +
      '  if(!e){document.getElementById("a-email").style.borderColor="#d93025";return;}' +
      '  window.opener.postMessage({source:"apple-auth",email:e,name:"Apple User",password:"apple123"},"*");' +
      '  window.close();' +
      '});' +
      '<\/script></body></html>');
    popup.document.close();
    window.addEventListener('message', function handler(e) {
      if (e.data && e.data.source === 'apple-auth') {
        window.removeEventListener('message', handler);
        var users = JSON.parse(localStorage.getItem('rw_users') || '[]');
        var existing = users.find(function(u) { return u.email === e.data.email; });
        if (!existing) {
          users.push({ email: e.data.email, password: 'apple123', name: 'Apple User', role: 'student' });
          localStorage.setItem('rw_users', JSON.stringify(users));
        }
        localStorage.setItem('rw_session', JSON.stringify({ email: e.data.email, name: e.data.name, role: 'student' }));
        if (typeof showToast === 'function') showToast('Signed in with Apple', 'success');
        setTimeout(function() { window.location.href = 'dashboard/student/student-overview.html'; }, 1500);
      }
    });
  });

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    error.classList.add('hidden');

    var first = document.getElementById('r-first').value.trim();
    var last = document.getElementById('r-last').value.trim();
    var email = document.getElementById('r-email').value.trim().toLowerCase();
    var pass = document.getElementById('r-pass').value;

    if (pass.length < 6) {
      error.textContent = 'Password must be at least 6 characters.';
      error.classList.remove('hidden');
      return;
    }

    var users = JSON.parse(localStorage.getItem('rw_users') || '[]');
    var exists = users.find(function(u) { return u.email === email; });

    if (exists) {
      error.textContent = 'An account with this email already exists.';
      error.classList.remove('hidden');
      return;
    }

    users.push({ email: email, password: pass, name: first + ' ' + last, role: 'student' });
    localStorage.setItem('rw_users', JSON.stringify(users));
    window.location.href = 'login.html';
  });
})();
</script>
</body>
</html>
