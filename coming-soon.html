<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon | RouteWise</title>
<meta name="description" content="RouteWise is putting the finishing touches on something new.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><rect width=%2224%22 height=%2224%22 rx=%226%22 fill=%22%2314181F%22/><circle cx=%2212%22 cy=%2212%22 r=%224%22 fill=%22%23FFC53D%22/></svg>">
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/js/tailwind-config.js"></script>
<link rel="stylesheet" href="assets/css/style.css">

</head>

<body class="font-body bg-ink text-paper transition-colors" id="page">
<main id="main" class="min-h-screen grid place-items-center px-5 relative overflow-hidden">
  <div class="absolute inset-x-0 top-1/2 route-line is-progress opacity-20"></div>
  <div class="relative text-center max-w-xl">
    <div class="flex items-center justify-center gap-2 mb-8">
      <span class="w-10 h-10 rounded-md bg-paper grid place-items-center"><span class="w-3 h-3 rounded-full bg-signal"></span></span>
      <span class="font-display font-medium text-xl">RouteWise</span>
    </div>
    <p class="text-signal font-mono text-xs uppercase tracking-wider font-semibold mb-3">Under construction</p>
    <h1 class="font-display font-semibold text-4xl sm:text-5xl mb-4">We're paving a new route.</h1>
    <p class="text-paper/60 mb-10">Our multi-branch academy dashboard launches soon. Leave your email and we'll notify you the day it's live.</p>
    <form class="flex flex-col sm:flex-row gap-3 justify-center max-w-md mx-auto mb-10">
      <label for="cs-email" class="sr-only">Email address</label>
      <input id="cs-email" type="email" required placeholder="you@example.com" class="flex-1 rounded-full bg-paper/10 border border-paper/20 px-5 py-3 text-sm placeholder:text-paper/40 focus:outline-none focus:border-signal">
      <button type="submit" class="bg-signal text-ink font-semibold px-6 py-3 rounded-full">Notify me</button>
    </form>
    <div class="grid grid-cols-4 gap-3 max-w-sm mx-auto text-center">
      <div class="bg-paper/5 rounded-xl py-3"><p class="stat-mono text-xl font-bold">12</p><p class="text-[11px] text-paper/50">days</p></div>
      <div class="bg-paper/5 rounded-xl py-3"><p class="stat-mono text-xl font-bold">08</p><p class="text-[11px] text-paper/50">hours</p></div>
      <div class="bg-paper/5 rounded-xl py-3"><p class="stat-mono text-xl font-bold">41</p><p class="text-[11px] text-paper/50">mins</p></div>
      <div class="bg-paper/5 rounded-xl py-3"><p class="stat-mono text-xl font-bold">02</p><p class="text-[11px] text-paper/50">secs</p></div>
    </div>
    <a href="index.html" class="inline-block mt-10 text-sm font-semibold underline underline-offset-4 text-paper/70">← Back to home</a>
  </div>
</main>
<script src="assets/js/app.js"></script></body></html>
