<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings | RouteWise Admin</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><rect width=%2224%22 height=%2224%22 rx=%226%22 fill=%22%2314181F%22/><circle cx=%2212%22 cy=%2212%22 r=%224%22 fill=%22%23FFC53D%22/></svg>">
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../assets/js/tailwind-config.js"></script>
<link rel="stylesheet" href="../../assets/css/style.css">
<link rel="stylesheet" href="../shared/dashboard.css">
<style>
  .toggle-track {
    width: 44px; height: 24px; border-radius: 12px; cursor: pointer;
    background: rgba(166, 155, 139, 0.25); position: relative;
    transition: background 0.25s ease; flex-shrink: 0;
  }
  .dark .toggle-track { background: rgba(255, 255, 255, 0.12); }
  .toggle-track::after {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 18px; height: 18px; border-radius: 50%;
    background: #9AA1AC; transition: all 0.25s cubic-bezier(0.22,1,0.36,1);
    box-shadow: 1px 1px 4px rgba(0,0,0,0.15);
  }
  .toggle-input:checked + .toggle-track {
    background: #0FA36B;
  }
  .toggle-input:checked + .toggle-track::after {
    transform: translateX(20px); background: #fff;
  }
</style>
</head>
<body class="font-body bg-paper text-ink dark:bg-ink dark:text-paper transition-colors" data-page-title="Settings">
<div data-dash-overlay class="dash-overlay"></div>
<div class="dash-layout">
  <aside data-dash-sidebar class="dash-sidebar"></aside>
  <div class="dash-main">
    <header data-dash-topbar class="dash-topbar"></header>
    <main class="dash-content">

      <!-- Success / Error Popups -->
      <div id="settingsPopup" class="dash-popup">
        <div class="popup-icon">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        </div>
        <span id="settingsPopupMsg"></span>
      </div>

      <!-- Delete Confirmation Modal -->
      <div id="deleteModal" class="dash-modal-overlay">
        <div class="dash-modal">
          <div class="dash-modal-header">
            <h3 class="font-display font-bold text-lg">Delete Account</h3>
            <button onclick="closeDeleteModal()" class="w-8 h-8 grid place-items-center rounded-lg hover:bg-ink/10 dark:hover:bg-paper/10 transition-colors">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
          <p class="text-sm text-ink/60 dark:text-paper/60 mb-6">Are you sure? This action cannot be undone. All your data will be permanently removed.</p>
          <div class="flex justify-end gap-3">
            <button onclick="closeDeleteModal()" class="px-5 py-2.5 rounded-xl font-semibold text-sm bg-ink/5 dark:bg-paper/10 hover:bg-ink/10 dark:hover:bg-paper/15 transition-colors">Cancel</button>
            <button onclick="confirmDelete()" class="px-5 py-2.5 rounded-xl font-semibold text-sm text-white bg-clay hover:bg-clay/90 transition-colors">Delete Account</button>
          </div>
        </div>
      </div>

      <!-- Profile Settings -->
      <div class="neu-card p-6 mb-5">
        <h2 class="font-display font-bold text-lg mb-5">Profile Settings</h2>
        <div class="flex items-center gap-4 mb-6">
          <div id="ad-avatar" class="w-16 h-16 rounded-full bg-signal/15 text-signal grid place-items-center font-display font-bold text-xl shrink-0">--</div>
          <button class="text-sm font-semibold text-signal hover:underline">Change Photo</button>
        </div>
        <form id="profileForm" onsubmit="return false">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="dash-label">First Name</label>
              <input type="text" id="ad-first" class="dash-input" value="">
            </div>
            <div>
              <label class="dash-label">Last Name</label>
              <input type="text" id="ad-last" class="dash-input" value="">
            </div>
            <div>
              <label class="dash-label">Email</label>
              <input type="email" id="ad-email" class="dash-input" value="">
            </div>
            <div>
              <label class="dash-label">Phone</label>
              <input type="tel" id="ad-phone" class="dash-input" value="">
            </div>
            <div>
              <label class="dash-label">School Name</label>
              <input type="text" id="ad-school" class="dash-input" value="RouteWise Downtown">
            </div>
            <div>
              <label class="dash-label">Business Hours</label>
              <input type="text" id="ad-hours" class="dash-input" value="Mon-Fri 8AM-6PM, Sat 9AM-3PM">
            </div>
          </div>
          <button type="button" onclick="saveProfile()" class="mt-5 px-6 py-2.5 rounded-xl font-semibold text-sm text-white bg-route hover:bg-route/90 transition-colors">Save Profile</button>
        </form>
      </div>

      <!-- Change Password -->
      <div class="neu-card p-6 mb-5">
        <h2 class="font-display font-bold text-lg mb-5">Change Password</h2>
        <form id="passwordForm" onsubmit="return false">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="dash-label">Current Password</label>
              <input type="password" id="currentPassword" class="dash-input" placeholder="Enter current password">
            </div>
            <div></div>
            <div>
              <label class="dash-label">New Password</label>
              <input type="password" id="newPassword" class="dash-input" placeholder="Enter new password">
            </div>
            <div>
              <label class="dash-label">Confirm New Password</label>
              <input type="password" id="confirmPassword" class="dash-input" placeholder="Confirm new password">
            </div>
          </div>
          <button type="button" onclick="updatePassword()" class="mt-5 px-6 py-2.5 rounded-xl font-semibold text-sm text-white bg-route hover:bg-route/90 transition-colors">Update Password</button>
        </form>
      </div>

      <!-- Notification Preferences -->
      <div class="neu-card p-6 mb-5">
        <h2 class="font-display font-bold text-lg mb-5">Notification Preferences</h2>
        <div class="flex flex-col gap-5">
          <label class="flex items-center gap-4 cursor-pointer">
            <input type="checkbox" class="toggle-input hidden" checked>
            <span class="toggle-track"></span>
            <span class="text-sm font-semibold">Email notifications for new enrollments</span>
          </label>
          <label class="flex items-center gap-4 cursor-pointer">
            <input type="checkbox" class="toggle-input hidden" checked>
            <span class="toggle-track"></span>
            <span class="text-sm font-semibold">SMS reminders for upcoming lessons</span>
          </label>
          <label class="flex items-center gap-4 cursor-pointer">
            <input type="checkbox" class="toggle-input hidden">
            <span class="toggle-track"></span>
            <span class="text-sm font-semibold">Weekly payment reports</span>
          </label>
          <label class="flex items-center gap-4 cursor-pointer">
            <input type="checkbox" class="toggle-input hidden" checked>
            <span class="toggle-track"></span>
            <span class="text-sm font-semibold">Student completion alerts</span>
          </label>
        </div>
        <button type="button" onclick="savePreferences()" class="mt-5 px-6 py-2.5 rounded-xl font-semibold text-sm text-white bg-route hover:bg-route/90 transition-colors">Save Preferences</button>
      </div>

      <!-- Danger Zone -->
      <div class="neu-card p-6 border-2 border-clay/30">
        <h2 class="font-display font-bold text-lg text-clay mb-1">Danger Zone</h2>
        <p class="text-sm text-ink/50 dark:text-paper/50 mb-5">Permanently delete your admin account and all associated data</p>
        <button type="button" onclick="openDeleteModal()" class="px-6 py-2.5 rounded-xl font-semibold text-sm text-white bg-clay hover:bg-clay/90 transition-colors">Delete Account</button>
      </div>

    </main>
  </div>
</div>
<script src="../shared/sidebar-admin.js"></script>
<script>
  (function () {
    var session = JSON.parse(localStorage.getItem('rw_session') || 'null');
    if (!session || session.role !== 'admin') {
      window.location.href = '../../admin-login.html';
      return;
    }

    var admins = JSON.parse(localStorage.getItem('rw_admins') || '[]');
    var user = admins.find(function (a) { return a.email === session.email; }) || session;
    var first = user.name ? user.name.split(' ')[0] : '';
    var last = user.name ? user.name.split(' ').slice(1).join(' ') : '';

    document.getElementById('ad-avatar').textContent = first.charAt(0).toUpperCase() + (last.charAt(0) || '').toUpperCase();
    document.getElementById('ad-first').value = first;
    document.getElementById('ad-last').value = last;
    document.getElementById('ad-email').value = user.email || '';
    document.getElementById('ad-phone').value = user.phone || '';

    window.saveProfile = function () {
      var f = document.getElementById('ad-first').value.trim();
      var l = document.getElementById('ad-last').value.trim();
      var e = document.getElementById('ad-email').value.trim();
      var p = document.getElementById('ad-phone').value.trim();
      var school = document.getElementById('ad-school').value.trim();
      var hours = document.getElementById('ad-hours').value.trim();

      if (!f || !l || !e) { showPopup('error', 'First name, last name and email are required'); return; }

      var idx = admins.findIndex(function (a) { return a.email === session.email; });
      if (idx >= 0) {
        admins[idx].name = f + ' ' + l;
        admins[idx].email = e;
        admins[idx].phone = p;
        admins[idx].school = school;
        admins[idx].hours = hours;
      }

      session.name = f + ' ' + l;
      session.email = e;
      session.phone = p;
      session.school = school;
      session.hours = hours;

      localStorage.setItem('rw_admins', JSON.stringify(admins));
      localStorage.setItem('rw_session', JSON.stringify(session));

      document.getElementById('ad-avatar').textContent = f.charAt(0).toUpperCase() + (l.charAt(0) || '').toUpperCase();
      showPopup('success', 'Profile updated successfully');
    };

    window.updatePassword = function () {
      var current = document.getElementById('currentPassword').value;
      var newPw = document.getElementById('newPassword').value;
      var confirmPw = document.getElementById('confirmPassword').value;

      if (newPw.length < 6) { showPopup('error', 'New password must be at least 6 characters'); return; }
      if (newPw !== confirmPw) { showPopup('error', 'Passwords do not match'); return; }

      var idx = admins.findIndex(function (a) { return a.email === session.email; });
      if (idx >= 0) {
        if (admins[idx].password !== current) { showPopup('error', 'Current password is incorrect'); return; }
        admins[idx].password = newPw;
        localStorage.setItem('rw_admins', JSON.stringify(admins));
      }

      document.getElementById('currentPassword').value = '';
      document.getElementById('newPassword').value = '';
      document.getElementById('confirmPassword').value = '';
      showPopup('success', 'Password updated successfully');
    };

    window.openDeleteModal = function () { document.getElementById('deleteModal').classList.add('open'); };
    window.closeDeleteModal = function () { document.getElementById('deleteModal').classList.remove('open'); };
    window.confirmDelete = function () {
      var idx = admins.findIndex(function (a) { return a.email === session.email; });
      if (idx >= 0) { admins.splice(idx, 1); localStorage.setItem('rw_admins', JSON.stringify(admins)); }
      localStorage.removeItem('rw_session');
      window.location.href = '../../admin-login.html';
    };

    window.savePreferences = function () { showPopup('success', 'Preferences saved'); };

    document.getElementById('deleteModal').addEventListener('click', function (e) { if (e.target === this) closeDeleteModal(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDeleteModal(); });
  })();

  function showPopup(type, msg) {
    var el = document.getElementById('settingsPopup');
    el.className = 'dash-popup ' + type;
    document.getElementById('settingsPopupMsg').textContent = msg;
    var icon = el.querySelector('.popup-icon');
    if (type === 'error') {
      icon.innerHTML = '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>';
    } else {
      icon.innerHTML = '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';
    }
    el.classList.add('show');
    setTimeout(function () { el.classList.remove('show'); }, 3000);
  }
</script>

</body>
</html>
